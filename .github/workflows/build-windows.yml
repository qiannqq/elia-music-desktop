name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [Flutter]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build
        run: flutter build windows --release

      # 总是产 zip；Setup exe 那步是无 Inno 时仍能拿到发行包。
      - name: Pack portable zip
        shell: pwsh
        run: |
          $v = (Select-String pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value -replace '\+.*', ''
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release -DestinationPath dist\EliaMusic-$v-Portable-x64.zip -Force

      # 镜像里那个 Inno Setup 是"残"的：ISCC.exe 在（Test-Path 为 True）但启动即报
      # "The system cannot find the path specified." 且 0 秒退出、不打印任何
      # Inno Setup 自身输出 —— 是进程起不来，不是路径写错。所以强制重装一个版本。
      # choco 在"已安装"时往 stderr 写 warning，先临时放宽 ErrorActionPreference，
      # 否则 PowerShell 7 会把它当终止错误。脚本用绝对路径传，避开相对路径的坑。
      # 失败不阻断（continue-on-error）—— zip 仍然是有效发行包。
      - name: Compile Setup exe
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          choco install innosetup --version=6.2.2 -y --force 2>&1 | Out-Null
          $ErrorActionPreference = $old
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          Write-Host "using ISCC: $iscc (size $((Get-Item $iscc).Length))"
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc (Resolve-Path 'packaging/windows/elia_music.iss').Path /Q

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EliaMusic-Windows-x64
          path: |
            dist\EliaMusic-*.zip
            dist\EliaMusic-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist\EliaMusic-*.zip
            dist\EliaMusic-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
