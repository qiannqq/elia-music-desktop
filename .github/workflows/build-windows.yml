name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [Flutter]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build
        run: flutter build windows --release

      # 总是产 zip；Setup exe 那步是无 Inno 时仍能拿到发行包。
      - name: Pack portable zip
        shell: pwsh
        run: |
          $v = (Select-String pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value -replace '\+.*', ''
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release -DestinationPath dist\EliaMusic-$v-Portable-x64.zip -Force

      # windows-latest 镜像里预装了 Inno Setup，直接按候选目录找 ISCC.exe。
      # 不用 choco install：包"已安装"时它往 stderr 写 warning，配合
      # $ErrorActionPreference='Stop' 会被 PowerShell 7 当成终止错误。
      # 版本随镜像变（6 / 7），所以路径要两边都试；都找不到再从 PATH 找 iscc。
      # 失败不阻断（continue-on-error）—— zip 仍然是有效发行包。
      - name: Compile Setup exe
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            $cmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($cmd) { $exe = $cmd.Source }
          }
          if (-not $exe) { throw 'ISCC.exe not found on this runner' }
          Write-Host "using ISCC: $exe"
          # ISCC 不会自己创建输出目录，OutputDir 指向的目录不存在时它就报
          # "The system cannot find the path specified." 然后退出 1。
          New-Item -ItemType Directory -Force dist | Out-Null
          Write-Host "cwd: $(Get-Location)"
          Write-Host "dist: $(Test-Path dist) | icon: $(Test-Path windows\runner\resources\app_icon.ico) | built-exe: $(Test-Path build\windows\x64\runner\Release\elia_music.exe)"
          & $exe packaging/windows/elia_music.iss /Q

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EliaMusic-Windows-x64
          path: |
            dist\EliaMusic-*.zip
            dist\EliaMusic-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist\EliaMusic-*.zip
            dist\EliaMusic-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
