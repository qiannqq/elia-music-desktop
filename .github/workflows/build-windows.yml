name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [Flutter]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter build
        run: flutter build windows --release

      # 总是产 zip；Setup exe 那步是无 Inno 时仍能拿到发行包。
      - name: Pack portable zip
        shell: pwsh
        run: |
          $v = (Select-String pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value -replace '\+.*', ''
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release -DestinationPath dist\EliaMusic-$v-Portable-x64.zip -Force

      # windows-latest 镜像里通常已经带了 Inno Setup（choco 会回
      # "already installed"），所以先幂等地装一次，再把 PATH 刷成机器级的，
      # 然后直接用 iscc；PATH 里没有再退回按目录搜。
      # 不能写死 ISCC.exe 的路径 —— 目录名跟着版本号变（Inno Setup 6 / 7 …）。
      # 失败不阻断（continue-on-error）—— zip 仍然是有效发行包。
      - name: Compile Setup exe
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' +
                      [Environment]::GetEnvironmentVariable('Path','User')
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $iscc = Get-ChildItem 'C:\Program Files (x86)','C:\Program Files' -Filter 'ISCC.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe not found' }
          $exe = if ($iscc.Source) { $iscc.Source } else { $iscc.FullName }
          & $exe packaging/windows/elia_music.iss /Q

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EliaMusic-Windows-x64
          path: |
            dist\EliaMusic-*.zip
            dist\EliaMusic-*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist\EliaMusic-*.zip
            dist\EliaMusic-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
